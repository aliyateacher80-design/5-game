<!-- ТАЗА АШЫҚ СТИЛЬДЕГІ ИНТЕРАКТИВТІ БЛОК -->
<div id="topic-clean" class="topic-block active" style="font-family: 'Segoe UI', Tahoma, sans-serif; background: #ffffff; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-top: 25px; border: 1px solid #e2e8f0; color: #1e293b;">
    
    <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #3b82f6; padding-bottom: 12px; margin-top: 0;">
        <h2 style="color: #1e3a8a; margin: 0; font-size: 20px;">📌 Интерактивті тапсырма</h2>
        <span style="background: #3b82f6; color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold;">Тест / Ойын</span>
    </div>

    <p style="color: #475569; margin-top: 15px; font-size: 15px;"><b>Зерттеу сұрағы:</b> Тақырып бойынша негізгі мәселені анықтаңыз.</p>

    <!-- Оқушы мәліметі -->
    <div style="background: #f8fafc; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #cbd5e1;">
        <label style="color: #1e293b; font-weight: bold; font-size: 14px;">Оқушының аты-жөні:</label><br>
        <input type="text" id="studentNameX" placeholder="Аты-жөніңізді жазыңыз..." style="width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #94a3b8; border-radius: 6px; background: #ffffff; color: #000; font-size: 14px; outline: none; box-sizing: border-box;">
    </div>

    <!-- 1-ТАПСЫРМА -->
    <div style="background: #f8fafc; padding: 18px; border-radius: 10px; margin-bottom: 15px; border-left: 5px solid #3b82f6; border-top: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0;">
        <h4 style="color: #1d4ed8; margin-top: 0;">🎯 1-сұрақ [3 балл]</h4>
        <p style="color: #334155; font-size: 14px;"><i>Дұрыс жауапты таңдаңыз:</i></p>
        <label style="cursor: pointer; display: block; margin: 8px 0; color: #1e293b; font-size: 14px;"><input type="radio" name="q1" value="3" style="margin-right: 8px;"> A) Дұрыс жауап нұсқасы осында орналасады.</label>
        <label style="cursor: pointer; display: block; margin: 8px 0; color: #1e293b; font-size: 14px;"><input type="radio" name="q1" value="0" style="margin-right: 8px;"> B) Қате жауап нұсқасы.</label>
    </div>

    <!-- 2-ТАПСЫРМА -->
    <div style="background: #f8fafc; padding: 18px; border-radius: 10px; margin-bottom: 15px; border-left: 5px solid #10b981; border-top: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0;">
        <h4 style="color: #047857; margin-top: 0;">⚡ 2-сұрақ [4 балл]</h4>
        <p style="color: #334155; font-size: 14px;"><i>Талдау жасаңыз:</i></p>
        <label style="cursor: pointer; display: block; margin: 8px 0; color: #1e293b; font-size: 14px;"><input type="radio" name="q2" value="4" style="margin-right: 8px;"> A) Негізгі тарихи оқиғаның маңызын ашатын дұрыс жауап.</label>
        <label style="cursor: pointer; display: block; margin: 8px 0; color: #1e293b; font-size: 14px;"><input type="radio" name="q2" value="0" style="margin-right: 8px;"> B) Қате жауап.</label>
    </div>

    <!-- 3-ТАПСЫРМА -->
    <div style="background: #f8fafc; padding: 18px; border-radius: 10px; margin-bottom: 15px; border-left: 5px solid #f59e0b; border-top: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0;">
        <h4 style="color: #b45309; margin-top: 0;">🏆 3-сұрақ [3 балл]</h4>
        <p style="color: #334155; font-size: 14px;"><i>Қорытындыны анықтаңыз:</i></p>
        <label style="cursor: pointer; display: block; margin: 8px 0; color: #1e293b; font-size: 14px;"><input type="radio" name="q3" value="3" style="margin-right: 8px;"> A) Тарихи нәтижені дұрыс сипаттайтын нұсқа.</label>
        <label style="cursor: pointer; display: block; margin: 8px 0; color: #1e293b; font-size: 14px;"><input type="radio" name="q3" value="0" style="margin-right: 8px;"> B) Қате нұсқа.</label>
    </div>

    <button onclick="checkCleanScore()" style="background: #2563eb; color: white; border: none; padding: 14px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); transition: 0.3s;">🎯 Нәтижені тексеру (10 балл)</button>

    <div id="cleanResult" style="margin-top: 20px; font-weight: bold; font-size: 18px; text-align: center; padding: 12px; border-radius: 8px;"></div>
</div>

<script>
    function checkCleanScore() {
        const name = document.getElementById('studentNameX').value.trim();
        if(!name) {
            alert("Өтінемін, оқушының аты-жөнін жазыңыз!");
            return;
        }

        let score = 0;
        const q1 = document.querySelector('input[name="q1"]:checked');
        const q2 = document.querySelector('input[name="q2"]:checked');
        const q3 = document.querySelector('input[name="q3"]:checked');

        if(q1) score += parseInt(q1.value);
        if(q2) score += parseInt(q2.value);
        if(q3) score += parseInt(q3.value);

        const resDiv = document.getElementById('cleanResult');
        resDiv.style.background = "#f1f5f9";
        resDiv.innerHTML = `🎓 Оқушы: ${name} <br>⭐ Жинаған ұпайыңыз: ${score} / 10 балл`;
        
        if(score === 10) {
            resDiv.style.color = "#16a34a";
            resDiv.innerHTML += "<br>🎉 Керемет! Барлық тапсырма дұрыс орындалды!";
        } else if(score >= 6) {
            resDiv.style.color = "#d97706";
            resDiv.innerHTML += "<br>👍 Жақсы нәтиже!";
        } else {
            resDiv.style.color = "#dc2626";
            resDiv.innerHTML += "<br>💡 Қайтадан байқап көріңіз!";
        }
    }
</script>
